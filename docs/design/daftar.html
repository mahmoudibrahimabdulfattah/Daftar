html+=`<section id="system" class="section"><div class="intro"><h2>${t('قواعد دفتر البصرية','The Daftar design system')}</h2><p>${t('توكنز دلالية ومكوّنات مشتركة، لا ألوان منفصلة لكل شاشة. يتبدّل هذا القسم أيضًا مع المظهر واللغة. Alexandria للعربية، Rubik للإنجليزية والأرقام.','Semantic tokens and shared components, not per-screen colors. This section also follows theme and language. Alexandria for Arabic, Rubik for English and numerals.')}</p></div><div class="swatches">${[['paper',t('الورق','Paper'),'#F5F3EB','#191E18'],['surface',t('السطح','Surface'),'#FFFEF8','#232A21'],['ink',t('الحبر','Ink'),'#262D24','#EFF0E6'],['primary',t('الزيتوني','Olive'),'#45583D','#BFD0AD'],['gold',t('النحاسي','Brass'),'#835B24','#E7BF80'],['error',t('الخطأ','Error'),'#A1332C','#FFB4A9']].map(([key,name,light,dark])=>`<div class="swatch"><i style="background:var(--${key})"></i><strong>${name}</strong><code>${light} / ${dark}</code></div>`).join('')}</div><div class="specgrid"><div><h3>${t('الخط والتسلسل','Type and hierarchy')}</h3><p>${t('عنوان التطبيق 18sp/500، عنوان الشاشة 27sp/500، المبلغ الرئيسي 38sp/500، النص 13–16sp، التعليق 11–12sp. المسافات 4، 8، 12، 16، 20، 24، 32. أنصاف الأقطار 10 للحقول، 12 للأزرار، 16 للأسطح. إطار الهاتف في اللوحة 360 × 800.','App title 18sp/500, screen heading 27sp/500, hero amount 38sp/500, body 13–16sp, captions 11–12sp. Spacing: 4, 8, 12, 16, 20, 24, 32. Radii: fields 10, buttons 12, surfaces 16. Board phone frames: 360 × 800.')}</p><p>${t('لا نقلّل الخط لحشر النص: التمرير متاح داخل كل هاتف. عند تكبير خط النظام تنمو الصفوف والأزرار، وتنتقل القيمة لسطر ثانٍ عند الحاجة.','Do not shrink type to fit: every phone scrolls. With system font scaling, rows and buttons grow and values wrap onto a second line when needed.')}</p></div><div><h3>${t('اتجاه الأرقام واللمس','Numerals and interaction')}</h3><p>${t('0–9 في اللغتين. المبالغ مع فواصل آلاف ومنزلتين عشريتين، الأوزان حتى منزلتين. كل رقم ووحدته داخل عزل LTR؛ لوحة PIN تظل 1–9 من اليسار لليمين. الأسهم الاتجاهية تنعكس، وأيقونات الذهب والبصمة لا تنعكس.','Digits 0–9 in both languages. Money uses grouping and two decimals; weights use up to two decimals. Numbers and units use LTR isolates; the PIN keypad stays 1–9 left to right. Directional arrows mirror; gold and fingerprint icons do not.')}</p><p>${t('الحد الأدنى لهدف اللمس 48dp، ولوحة الأرقام 58dp. حلقة تركيز واضحة، تسميات للأيقونات، ورسائل الخطأ نصية أيضًا. الحركة 180ms للتنقل؛ القفل والإخفاء فوريان. تقليل الحركة يلغي الانتقالات.','Minimum touch target 48dp; keypad 58dp. Visible focus rings, icon labels and textual errors. Navigation motion 180ms; locking and masking are immediate. Reduced-motion preference removes transitions.')}</p></div></div><div class="componenttray"><div><h3>${t('الأفعال','Actions')}</h3>${btn(t('حفظ التعديل','Save changes'),'gold-edit','primary full')}${btn(t('إضافة حساب','Add account'),'account-add','secondary full','plus')}<button class="primary full" disabled>${t('جارٍ الحفظ…','Saving…')}</button></div><div><h3>${t('المصدر والحالة','Source and status')}</h3><span class="tag">${t('حي','Live')}</span> <span class="tag">${t('محفوظ','Cached')}</span> <span class="tag warn">${t('يدوي','Manual')}</span> <span class="tag warn">${t('تقدير','Estimate')}</span>${note(t('السعر قديم. آخر نجاح: 10 أكتوبر، 09:40.','Stale quote. Last success: 10 Oct, 09:40.'),'warn','clock')}${note(t('أدخل مبلغًا أكبر من صفر.','Enter an amount greater than zero.'),'error','alert')}</div><div><h3>${t('الحقل والتحكم','Fields and controls')}</h3>${field(t('الرصيد · ج.م','Balance · EGP'),'2400.00','decimal')}${segment(['EGP','USD'])}${setting(t('البصمة','Biometrics'),t('فتح سريع','Quick unlock'),'','',true)}</div></div></section>`;
html+=`<section id="handoff" class="section"><div class="intro"><h2>${t('قرارات التنفيذ','Implementation decisions')}</h2><p>${t('هذه مواصفات للتنفيذ اللاحق، وليست ضمانات أمنية يحققها ملف HTML. لا يوجد كود Kotlin في التسليم.','These are requirements for the future app, not security guarantees provided by this HTML. This deliverable contains no Kotlin code.')}</p></div><div class="specgrid"><div><h3>${t('ثيم مخصص، متوافق مع Material 3','Custom theme, Material 3 compatible')}</h3><p>${t('DaftarTheme يملك الألوان والخطوط والأشكال وComponentStyles. الحاويات تستخدم Compose Styles API، مع style: Style = Style وModifier.styleable. محتوى النص والأيقونة يأتي من ProvideContent؛ وتُمرّر نسخة مطابقة من ColorScheme لمكوّنات Material 3.','DaftarTheme owns colors, typography, shapes and ComponentStyles. Containers use the Compose Styles API with style: Style = Style and Modifier.styleable. ProvideContent supplies text and icon content values; a matching ColorScheme keeps Material 3 components consistent.')}</p><p>${t('وفق المرجع المحلي، Styles API تجريبي ويحتاج إصدارات alpha واشتراكًا صريحًا في الواجهات التجريبية. يُتحقق من توافق Compose Multiplatform والإصدارات عند بدء التنفيذ؛ لا تُفترض مطابقة الدعم بين المنصات.','The supplied local guide marks Styles API experimental, requiring alpha dependencies and explicit opt-in. Verify Compose Multiplatform compatibility and versions at implementation time; cross-platform support is not assumed.')}</p><h3>${t('التنقل والحالة','Navigation and state')}</h3><p>${t('Navigation 3 بمفاتيح وجهات typed، وListDetailSceneStrategy للبنوك والحسابات. أربعة أقسام رئيسية تحفظ موضعها أثناء الجلسة. الرجوع من التحرير غير المحفوظ يعرض التأكيد. القفل يمسح مسار التفاصيل والمدخلات الحساسة؛ العودة تبدأ بالقفل، وبعد نجاحه الرئيسية.','Navigation 3 uses typed destination keys and ListDetailSceneStrategy for banks and accounts. Four top-level destinations retain position during the session. Back from an unsaved form asks to discard. Lock clears private route state and drafts; resume starts at lock, then home after authentication.')}</p><p><a href="https://developer.android.com/guide/navigation/navigation-3" target="_blank" rel="noopener">${t('مرجع Android: Navigation 3','Android reference: Navigation 3')}</a> · <a href="https://developer.android.com/develop/ui/compose/system/insets" target="_blank" rel="noopener">${t('المساحات الآمنة والحواف','Window insets and edge-to-edge')}</a></p></div><div><h3>${t('الرمز يحمي البيانات، لا الشاشة فقط','The PIN protects data, not just the UI')}</h3><p>${t('رمز من 6–16 رقمًا يُشتق منه مفتاح قاعدة البيانات باستخدام KDF مملّح ومكلف للذاكرة، بمعاملات تُقاس على الجهاز. قاعدة البيانات مشفّرة بالكامل. البصمة تفك مفتاحًا مغلّفًا ومقيّدًا بمصادقة Android Keystore؛ لا تفتح طريقًا خلفيًا برمز قفل الهاتف.','A 6–16 digit PIN derives the database key through a salted, memory-hard KDF with device-benchmarked parameters. The whole database is encrypted. Biometrics unwrap an authentication-bound key through Android Keystore; device credentials do not become an alternate app PIN.')}</p><p>${t('الخلفية تقفل فورًا: إغلاق قاعدة البيانات ومسح المفاتيح من الذاكرة قدر الإمكان. حماية recents وFLAG_SECURE مطلوبة قبل أول عرض حساس. التمويه إخفاء بصري وليس تشفيرًا، واسم التطبيق المحايد يقلّل الانتباه فقط.','Backgrounding locks immediately: close the database and clear keys from memory as far as practical. Recents protection and FLAG_SECURE are required before displaying sensitive content. Masking is visual privacy, not encryption; a neutral launcher name only reduces attention.')}</p><p>${t('بعد 5 محاولات خاطئة: 30 ثانية، ثم 60، ثم 120، حتى 15 دقيقة. العدّاد يستمر عبر إعادة الفتح؛ لا مسح تلقائي. نجاح التحقق يصفر العدّاد. يجب أن تصدر المهلة من طبقة الأمان، لا مؤقت الواجهة وحده.','After 5 wrong attempts: 30 seconds, then 60, then 120, capped at 15 minutes. Backoff survives relaunch; no automatic wipe. Successful verification resets the counter. Security enforces the delay; it is not a UI-only timer.')}</p></div><div><h3>${t('النسخ وحدود النظام','Backup and system boundaries')}</h3><p>${t('تشفير موثّق للنسخة مع ملح وnonce جديدين، ومفتاح من كلمة مرور مستقلة. منتقي المستندات للنقل، مع منح URI مؤقتة ومحددة؛ لا صلاحيات تخزين عامة. تُستبعد البيانات الحساسة من نسخ Android التلقائي. لا مكوّنات مصدّرة دون داعٍ ولا بيانات مالية في intents أو logs أو الإشعارات.','Authenticated backup encryption uses fresh salt and nonce plus a key derived from a separate password. Use the document picker and scoped temporary URI grants, without broad storage permissions. Exclude sensitive data from Android auto-backup. No unnecessary exported components or financial data in intents, logs or notifications.')}</p><p>${t('الاستيراد يتحقق من كلمة المرور والسلامة وإصدار التنسيق والحقول قبل الاستبدال الذري. الإلغاء أو الملف التالف يتركان الأصل سليمًا. تغيير الرمز يكتب نسخة مشفّرة مؤقتة ثم يستبدلها بعد التحقق. التصدير والاستيراد يحتاجان جلسة مفتوحة أو مسار استعادة بكلمة مرور النسخة.','Import validates password, integrity, format version and fields before atomic replacement. Cancelled or corrupt imports leave the original intact. PIN changes write and validate a temporary encrypted database before replacement. Export/import require an unlocked session or a recovery flow authenticated by the backup password.')}</p></div><div><h3>${t('الأسعار والحسابات','Prices and arithmetic')}</h3><p>${t('تحديث واحد عند الفتح بعد فك القفل، وبالسحب للتحديث؛ لا polling ولا مزامنة. التحديث يدويًا له زر بديل للوصول. كل اقتباس يحمل المصدر ووقت النجاح؛ السياسة المقترحة لوصف «قديم» هي أكثر من 24 ساعة، مستقلة عن توافر الشبكة.','One refresh on open after unlock, plus pull-to-refresh; no polling or sync. A refresh button provides an accessible alternative. Each quote keeps its source and success timestamp; the proposed stale threshold is over 24 hours, independent of network availability.')}</p><p>${t('21K = 6,185 ج.م/جرام كما ورد في الطلب. بقية الأسعار و48.50 للدولار أمثلة للعرض. 18K: 3.29 × 5,301 = 17,440.29. الذهب = 677,812.74، البنوك = 388,500، النقد = 9,900؛ الإجمالي = 1,076,212.74. كل أصل يُقيّم ثم يُجمع، بدون جمع مخفي للملاحظات أو طرح الزكاة.','21K = EGP 6,185/g as supplied in the brief. Other quotes and USD 48.50 are illustrative. 18K: 3.29 × 5,301 = 17,440.29. Gold = 677,812.74; banks = 388,500; cash = 9,900; total = 1,076,212.74. Value each asset, then sum; never silently add notes or deduct zakat.')}</p><p>${t('حسابات عشرية دقيقة، والتقريب النهائي للعرض فقط. سعر الصرف بدون مفتاح مقترح من ExchangeRate-API Open Access؛ حدود الخدمة والترخيص وطريقة الوصول إلى iSagha تُحسم قبل التنفيذ. لا طلبات أسعار من هذا الملف.','Use exact decimal arithmetic, rounding only for display. The proposed keyless FX source is ExchangeRate-API Open Access; service limits, licensing and iSagha access must be settled before implementation. This file makes no price requests.')}</p><p><a href="https://market.isagha.com/prices" target="_blank" rel="noopener">${t('مصدر الذهب: iSagha','Gold source: iSagha')}</a></p></div></div><h3>${t('مراجع محلية تمت مراجعتها','Reviewed local references')}</h3><p class="fine" dir="ltr">Nashra/AGENTS.md · Nashra/docs/design/nashra.html · Nashra/docs/design/brand/{logo-study.html, nashra-mark.svg, nashra-icon-light.svg, nashra-icon-dark.svg, nashra-silhouette.svg}<br>google-skills-main/system/edge-to-edge · jetpack-compose/theming/styles · jetpack-compose/adaptive · navigation/navigation-3 · security/android-intent-security · security/android-permissions-security</p></section><footer class="specfooter">${t('دفتر · تصميم الإصدار الأول · بيانات توضيحية فقط. ملف مستقل؛ Google Fonts هو الاعتماد الخارجي الوحيد.','Daftar · Version one design · Illustrative data only. Self-contained file; Google Fonts is the only external asset dependency.')} <a href="#top">${t('العودة للبداية','Back to top')}</a></footer>`;
document.querySelector('#gallery').innerHTML=html;
// Preserve localization and theme without storing any prototype input.
document.querySelector('#themeControl').onclick=()=>{theme=theme==='light'?'dark':'light';rerenderAtPosition();document.querySelector('#themeControl').focus?.({preventScroll:true})};

}
function rerenderAtPosition(){const sections=[...document.querySelectorAll('main>.section')];const anchor=sections.find(s=>s.getBoundingClientRect().bottom>150);const offset=anchor?anchor.getBoundingClientRect().top:0;const id=anchor?.id;const top=window.scrollY;render();if(id&&top>document.querySelector('#gallery').offsetTop){window.scrollTo({top:document.getElementById(id).offsetTop-offset,behavior:'instant'})}else{window.scrollTo({top,behavior:'instant'})}}
function go(id){const target=document.getElementById(id);if(!target)return;target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});target.setAttribute('tabindex','-1');target.focus({preventScroll:true});history.replaceState(null,'','#'+id)}
let toastTimer;
function toast(message){const el=document.querySelector('.toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
function normalize(value){return value.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/٬/g,'').replace(/٫/g,'.').replace(/,/g,'').trim()}
function validate(phone){const inputs=[...phone.querySelectorAll('input,textarea')];let error='';for(const input of inputs){input.removeAttribute('aria-invalid');input.closest('.field')?.classList.remove('invalid');if(input.dataset.numeric){const value=normalize(input.value);const positive=['gold-add','gold-edit','validation','manual','zakat-add'].includes(phone.closest('.frame')?.id);if(!/^\d+(\.\d{1,2})?$/.test(value)||+value<(positive?0.01:0)){error=t('أدخل قيمة صحيحة؛ حتى منزلتين عشريتين.','Enter a valid value with up to two decimal places.');input.setAttribute('aria-invalid','true');input.closest('.field')?.classList.add('invalid');input.focus();break;}input.value=value;}}
const id=phone.closest('.frame')?.id;const passwords=inputs.filter(i=>i.type==='password');if(!error&&['new-pin','restore-pin'].includes(id)){if(!/^\d{6,16}$/.test(normalize(passwords[0]?.value||''))||passwords[0]?.value!==passwords[1]?.value)error=t('أدخل رمزًا من 6–16 رقمًا وأكّده بنفس القيمة.','Enter a 6–16 digit PIN and confirm the same value.');}
if(!error&&['bank-add','account-add','account-edit','cash-add','cash-edit','note-add','note-edit'].includes(id)){const name=phone.querySelector('input:not([data-numeric])');if(name&&!name.value.trim()){error=t('أدخل الاسم أو العنوان أولًا.','Enter the name or title first.');name.setAttribute('aria-invalid','true');name.focus();}}
return error;}
document.addEventListener('change',e=>{if(e.target.matches('[data-zakat-check]')){const checked=e.target.checked;e.target.checked=!checked;go(checked?'zakat-paid':'zakat-unmark');}});
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button||button.disabled)return;
 if(button.hasAttribute('data-segment')){button.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));return;}
 if(button.hasAttribute('data-switch')){const on=button.getAttribute('aria-checked')!=='true';button.setAttribute('aria-checked',String(on));button.querySelector('.toggle').classList.toggle('off',!on);toast(t(on?'البصمة مفعّلة في المعاينة':'البصمة متوقفة في المعاينة',on?'Biometrics enabled in preview':'Biometrics disabled in preview'));return;}
 if(button.hasAttribute('data-hide')){const phone=button.closest('.phone');const hidden=button.getAttribute('aria-pressed')!=='true';phone.querySelector('.content').innerHTML=dashboard(hidden,phone.closest('.frame').id==='offline-home');return;}
 if(button.dataset.key){const phone=button.closest('.phone');const input=phone.querySelector('.pininput')||phone.querySelector('input[type=password]');if(!input)return;const key=button.dataset.key;if(key==='finger'){go('biometric-prompt');return}if(key==='erase')input.value=input.value.slice(0,-1);else if(input.value.length<16)input.value+=key;return;}
 if(button.hasAttribute('data-save')){const phone=button.closest('.phone');const error=validate(phone);const result=phone.querySelector('.result');if(result){result.classList.toggle('error',!!error);result.textContent=error||t('تم التحقق في المعاينة. لا تُحفظ أي بيانات في هذا الملف.','Validated in preview. This file does not store any data.');}else toast(error||t('تم التحقق في المعاينة.','Validated in preview.'));return;}
 if(button.dataset.go){go(button.dataset.go);return;}
 if(button.hasAttribute('data-demo'))toast(t('معاينة تصميم فقط؛ لم تتغيّر أي بيانات.','Design preview only; no data was changed.'));
});
render();
if(location.hash)requestAnimationFrame(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView());

const p24BaseRender=render;
render=function(){
 p24BaseRender();
 document.querySelector('#gallery').insertAdjacentHTML('beforeend',section('phase-24',t('الاستثمارات · قيمة واحدة لكل حساب','Investments · one value per account'),t('اختر الوسيط، ثم اكتب إجمالي القيمة الحالية. حدّثها عندما يناسبك. كل الأرقام أمثلة توضيحية.','Choose the broker, then enter the total current value. Update it when convenient. All figures are illustrative.')+' <a href="phase-24-investments.md">'+t('المواصفات وقرارات التنفيذ','Design and implementation spec')+'</a>',p24Frames()));
 document.querySelector('#jump').insertAdjacentHTML('beforeend',`<option value="phase-24">${t('الاستثمارات · المرحلة 24','Investments · Phase 24')}</option>`);
 const rail=`<aside class="rail">${[['home','الرئيسية','Home','home'],['gold','الأصول','Assets','p24-assets'],['note','السجل','Journal','journal'],['settings','الإعدادات','Settings','settings']].map(([i,ar,en,target])=>`<button data-go="${target}" class="${i==='gold'?'active':''}">${icon(i)}${t(ar,en)}</button>`).join('')}</aside>`;
 document.querySelector('#phase-24').insertAdjacentHTML('beforeend',`<article class="frame p24-wide" id="p24-wide"><div class="caption"><b>${t('شاشة واسعة · قائمة وتفاصيل','Expanded · list and detail')}</b><span>≥840dp</span></div><div class="tablet"><div class="tabletmain">${rail}<div class="tabletlist"><h2>${t('الاستثمارات','Investments')}</h2>${p24BrokerRow()}${p24Action('إضافة حساب استثمار','Add investment account','p24-provider','secondary full')}</div><div class="tabletdetail"><div class="sectionrow"><h2>${t('حساب الاستثمار','Investment account')}</h2>${p24Eye()}</div>${p24Detail()}</div></div></div></article>`);
 document.querySelectorAll('#phase-24 input,#phase-24 textarea').forEach(el=>{el.autocomplete='off';if(el.matches('[data-numeric]'))el.dataset.p24Previous=p24NumericKey(el.value);if(p24Hidden&&el.closest('[data-p24-sensitive-field]'))el.disabled=true;});
};
document.addEventListener('click',e=>{
 const eye=e.target.closest('[data-p24-eye]');if(eye){e.stopImmediatePropagation();p24Hidden=!p24Hidden;const id=eye.closest('.frame').id;render();go(id);return;}
 const provider=e.target.closest('[data-p24-provider]');if(provider){e.stopImmediatePropagation();p24ConvertBroker=provider.dataset.p24Provider;render();go('p24-convert-review');return;}
 const confirm=e.target.closest('[data-p24-confirm]');if(confirm){e.stopImmediatePropagation();if(!p24Hidden)go('p24-converted');return;}
 const now=e.target.closest('[data-p24-now]');if(now){e.stopImmediatePropagation();now.closest('.content').querySelector('[data-p24-time-label]').textContent=t('الآن عند الحفظ · معاينة','Now when saved · preview');return;}
 const save=e.target.closest('[data-p24-save]');if(save){e.stopImmediatePropagation();save.closest('.phone').querySelector('.result').textContent=t('معاينة فقط؛ لا تُحفظ بيانات. راجع حالات التحقق والفشل في المعرض.','Preview only; no data saved. See validation and failure frames in the gallery.');}
},true);
document.addEventListener('input',e=>{if(!e.target.closest('#phase-24'))return;const label=e.target.closest('.content')?.querySelector('[data-p24-time-label]');if(label&&e.target.matches('[data-numeric]')){const key=p24NumericKey(e.target.value);if(key!==e.target.dataset.p24Previous)label.textContent=t('الآن عند الحفظ · معاينة','Now when saved · preview');e.target.dataset.p24Previous=key;}if(label&&e.target.matches('input[type=date],input[type=time]'))label.textContent=t('التاريخ والوقت اللذان اخترتهما','Your selected date and time');});

// Phase 25: stable PIN lanes, quiet prices and an optional first-record guide.
function p25Pin(mode='create',large=false){
 const confirm=['confirm','mismatch'].includes(mode),unlock=!confirm&&mode!=='create';
 const title=t(confirm?'أكّد رمزك':unlock?'افتح دفتر':'رمز خاص بدفترك',confirm?'Confirm your PIN':unlock?'Open Daftar':'A PIN for your notebook');
 const messages={create:t('اختر من ⁦6⁩ إلى ⁦16⁩ رقمًا، مختلفة عن رمز هاتفك.','Choose 6–16 digits, different from your phone PIN.'),confirm:t('أدخل الرمز نفسه مرة ثانية.','Enter the same PIN again.'),mismatch:t('الرمزان غير متطابقين. أعد إدخال الرمز.','PINs do not match. Enter the PIN again.'),unlock:t('أدخل رمز دفتر للمتابعة.','Enter your Daftar PIN to continue.'),incorrect:t('الرمز غير صحيح. حاول مرة أخرى.','Incorrect PIN. Try again.'),backoff:t('انتظر ⁦30⁩ ثانية قبل المحاولة.','Wait 30 seconds before trying again.'),biometric:t('البصمة غير متاحة الآن. استخدم رمز دفتر.','Biometrics are unavailable. Use your Daftar PIN.')};
 const error=['mismatch','incorrect','backoff'].includes(mode);
 const keys=keypad(mode==='backoff').replace('data-key="finger"',unlock?'data-key="finger"':'data-key="finger" hidden');
 const next=mode==='create'?'p25-confirm':confirm?'p25-mismatch':'p25-incorrect';
 const body=`<div class="p25-pin ${large?'p25-large':''}"><div class="p25-intro">${mark()}<div class="p25-step fine">${unlock?'':t(confirm?'الخطوة ⁦2⁩ من ⁦3⁩':'الخطوة ⁦1⁩ من ⁦3⁩',confirm?'Step 2 of 3':'Step 1 of 3')}</div><h1>${title}</h1></div><div class="p25-input-block"><input class="pininput" type="password" maxlength="16" inputmode="numeric" autocomplete="off" aria-label="${t('رمز دفتر','Daftar PIN')}" placeholder="••••••" ${mode==='backoff'?'disabled':''}><div class="p25-message ${error?'p25-error':mode==='biometric'?'p25-context':''}" ${error?'role="status" aria-live="polite"':''}>${messages[mode]}</div>${keys}<button class="primary full" data-go="${next}" ${mode==='backoff'?'disabled':''}>${t(confirm?'تأكيد':unlock?'فتح':'متابعة',confirm?'Confirm':unlock?'Unlock':'Continue')}</button><div class="p25-pin-footer">${mode==='create'?`<p class="fine">${t('لا يمكن استعادة الرمز إذا نسيته.','Your PIN cannot be recovered if forgotten.')}</p>`:btn(t(confirm?'اختيار رمز آخر':'نسيت الرمز؟',confirm?'Choose another PIN':'Forgot PIN?'),confirm?'p25-create':'recovery','textbutton full')}</div></div></div>`;
 return frame('p25-'+(large?'pin-200':mode),title+(large?' · 200%':''),body,{back:'p25-create',heading:' '}).replace('class="frame"','class="frame p25-auth"').replace('<header class="topbar">','<header class="topbar '+(confirm?'':'p25-bar-empty')+'">');
}
function p25Quotes(failed=false){return `<div class="pricestrip"><p class="fine">${t('بيع الصائغ · ج.م / جرام','Merchant sell · EGP / gram')}</p><div class="quotes">${['24K','21K','18K','USD'].map(k=>`<div>${n(k)}<br><span aria-label="${t('غير متاح','Unavailable')}">—</span></div>`).join('')}</div><p class="fine p25-status">${failed?t('الأسعار غير متاحة الآن. يمكنك إضافة أصولك.','Prices are unavailable right now. You can still add assets.'):t('في انتظار الأسعار','Waiting for prices')}</p>${btn(t('التفاصيل','Details'),'p25-prices','textbutton')}</div>`;}
function p25Guide(){return `<div class="p25-guide"><h2>${t('ابدأ بما لديك','Start with what you have')}</h2><p>${t('أضف أول أصل، وأكمل الباقي وقتما تحب.','Add your first asset. Add the rest whenever you like.')}</p>${row('gold',t('أضف ذهبك','Add your gold'),t('اختر العيار وسجّل الوزن.','Choose the karat and enter the weight.'),'','p25-gold','gold')}${row('bank',t('حساباتك البنكية ونقدك','Your bank accounts and cash'),t('سجّل حسابًا أو نقدًا أو محفظة.','Record an account, cash or a wallet.'),'','p25-money')}${row('investments',t('أضف استثماراتك','Add your investments'),t('سجّل القيمة الحالية لحسابك.','Enter your account’s current value.'),'','p24-provider')}${btn(t('إخفاء الدليل','Hide guide'),'p25-dismissed','textbutton full')}</div>`;}
function p25Frames(){
 let s=['create','confirm','mismatch','unlock','incorrect','backoff','biometric'].map(m=>p25Pin(m)).join('')+p25Pin('mismatch',true);
 const refresh=ib('refresh',t('تحديث الأسعار','Refresh prices'),'p25-explicit');
 s+=frame('p25-home',t('دفتر','Daftar'),p25Guide()+p25Quotes(),{brand:true,nav:'home',action:refresh});
 s+=frame('p25-home-failed',t('الأسعار غير متاحة','Prices unavailable'),p25Guide()+p25Quotes(true),{brand:true,nav:'home',action:refresh});
 s+=frame('p25-dismissed',t('دفتر','Daftar'),emptyBody(t('دفترك جاهز','Your notebook is ready'),t('أضف أصلًا عندما تكون مستعدًا.','Add an asset when you’re ready.'),t('إضافة أصل','Add an asset'),'assets')+p25Quotes(),{brand:true,nav:'home',action:refresh});
 s+=frame('p25-money',t('حساباتك البنكية ونقدك','Your bank accounts and cash'),row('bank',t('إضافة حساب بنكي','Add bank account'),'','','bank-add')+row('wallet',t('إضافة نقد أو محفظة','Add cash or wallet'),'','','cash-add'),{back:'p25-home'});
 s+=frame('p25-gold',t('مقتنى جديد','New holding'),`<p>${t('العيار هو درجة نقاء الذهب؛ سجّل وزنه بالجرام دون الأحجار.','Karat is gold purity; enter its weight in grams without stones.')}</p>`+goldForm().replace(/<h1>[\s\S]*?<\/h1>/,'').replace(/<div class="note[\s\S]*$/,note(t('في انتظار الأسعار','Waiting for prices'))) ,{back:'p25-home',footer:save()});
 const pending=`<div class="balance"><small>${t('قيمة الأصول','Total assets')}</small><div class="amount">—</div><p>${t('في انتظار الأسعار','Waiting for prices')}</p><small>${t('مجموع الأصول المتاح تقييمها','Available subtotal')}</small><div>${eg('1,000.00')}</div></div>`+row('gold',t('الذهب','Gold'),t('في انتظار الأسعار','Waiting for prices'),'—','gold','gold')+row('wallet',t('النقد والمحافظ','Cash & wallets'),t('قيمة توضيحية','Illustrative value'),eg('1,000.00'),'cash');
 s+=frame('p25-home-pending',t('دفتر · تقييم غير مكتمل','Daftar · incomplete valuation'),pending+p25Quotes(),{brand:true,nav:'home',action:refresh});
 s+=frame('p25-assets',t('الأصول · تقييم غير مكتمل','Assets · incomplete valuation'),pending,{nav:'assets',action:refresh});
 const table=`<h2>${t('أسعار الذهب','Gold prices')}</h2><p class="fine">${t('بيع الصائغ · ج.م / جرام','Merchant sell · EGP / gram')}</p><table class="table"><thead><tr><th>${t('العيار','Karat')}</th><th>${t('شراء','Buy')}</th><th>${t('بيع','Sell')}</th></tr></thead><tbody>${['24K','21K','18K'].map(k=>`<tr><td>${n(k)}</td><td>—</td><td>—</td></tr>`).join('')}</tbody></table><h2>${t('الدولار الأمريكي','US dollar')}</h2><p>USD / EGP <span class="num">—</span></p>`;
 s+=frame('p25-prices',t('الأسعار','Prices'),note(t('في انتظار الأسعار','Waiting for prices'))+table+btn(t('إدخال سعر يدوي','Enter a manual price'),'manual','textbutton full'),{back:'p25-home',action:refresh});
 s+=frame('p25-explicit',t('تحديث بطلبك','Your refresh'),`<p role="status">${t('جارٍ تحديث الأسعار…','Updating prices…')}</p>`+table,{back:'p25-prices',action:`<span class="iconbutton" role="status" aria-label="${t('جارٍ تحديث الأسعار…','Updating prices…')}"><span class="p25-spinner"></span></span>`});
 s+=frame('p25-retained',t('أسعار محفوظة · مثال','Cached prices · example'),priceStrip()+note(t('تعذّر تحديث الأسعار. نستخدم آخر أسعار متاحة.','Could not update prices. Using the last available prices.'))+btn(t('إدخال سعر يدوي','Enter a manual price'),'manual','textbutton full'),{back:'p25-home',action:refresh});
 s+=frame('p25-manual',t('سعر يدوي · مثال','Manual price · example'),row('gold',t('بيع عيار ⁦21⁩','21K merchant sell'),t('يدوي · ⁦12 أكتوبر، 09:40⁩','Manual · 12 Oct, 09:40'),eg('6,185'),'manual','gold')+note(t('تعذّر تحديث الأسعار. نستخدم آخر أسعار متاحة.','Could not update prices. Using the last available prices.')),{back:'p25-prices',action:refresh});
 return s;
}

render=function(){p25BaseRender();document.querySelector('#gallery').insertAdjacentHTML('beforeend',section('p25-first-run',t('أول استخدام · ثبات وهدوء','First run · steady and quiet'),t('شاشات مرجعية؛ الأرقام أمثلة، ولا تُحفظ بيانات. مرّر داخل شاشة الرمز القصيرة للوصول إلى كل الأزرار.','Reference frames; figures are illustrative and no data is saved. Scroll inside short PIN screens to reach every control.')+' <a href="phase-25-first-run.md">'+t('المواصفات والنصوص','Specification and copy')+'</a>',p25Frames()));document.querySelector('#jump').insertAdjacentHTML('beforeend',`<option value="p25-first-run">${t('أول استخدام · المرحلة 25','First run · Phase 25')}</option>`);};

render();
