name: CI

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Code style (ktlint + Compose rules)
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew testAndroidHostTest --continue

      - name: Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Assemble debug and release (R8)
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: '**/build/reports/'

  # macOS runners are free for public repositories only; a private copy skips these jobs.
  desktop:
    name: Desktop
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Desktop tests and app compile
        run: ./gradlew desktopTest :desktopApp:compileKotlinJvm --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-reports
          path: '**/build/reports/'

  ios:
    name: iOS
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true

      - name: Kotlin tests on the simulator
        run: ./gradlew iosSimulatorArm64Test -Pdaftar.ios.simulator="$SIMULATOR" --continue

      - name: Link the shared framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build the app
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination "id=$SIMULATOR" -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: '**/build/reports/'
